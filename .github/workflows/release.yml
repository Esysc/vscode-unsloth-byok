name: Release

# Creates a GitHub release whenever a v* tag is pushed.
# - Verifies the tag matches package.json version
# - Extracts the matching section from CHANGELOG.md as release notes
# - Packages the extension and attaches the VSIX to the release
#
# Usage:
#   1. Bump "version" in package.json
#   2. Add a "## [X.Y.Z] - YYYY-MM-DD" section to CHANGELOG.md
#   3. git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package.json version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION — bump package.json before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this version
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/                 { if (flag) exit }
            /^\[[^]]*\]:/            { if (flag) exit }   # skip link definitions
            flag
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for v${{ steps.ver.outputs.version }}." > RELEASE_NOTES.md
            echo "See https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md." >> RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat RELEASE_NOTES.md

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            ./unsloth-byok-*.vsix \
          || gh release upload "$GITHUB_REF_NAME" ./unsloth-byok-*.vsix --clobber
