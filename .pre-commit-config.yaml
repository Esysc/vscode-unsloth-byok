# Pre-commit configuration for vscode-unsloth-byok
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml

  - repo: local
    hooks:
      - id: node-syntax-check
        name: node syntax check (extension.js)
        entry: node --check extension.js
        language: system
        pass_filenames: false
        files: ^extension\.js$
